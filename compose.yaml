services:
  s3:
    build: .
    command: ["serve", "/data", "--host", "0.0.0.0", "--port", "9000", "--cors", "http://localhost:5173"]
    ports: ["9000:9000"]
    # The entrypoint takes ownership of this bind source once, then runs
    # s3dir as its unprivileged user. A fresh Linux checkout works directly.
    volumes: ["./dev-data:/data"]
